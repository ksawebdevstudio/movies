name: Update movie page

on:
  schedule:
    - cron: "17 13,19,1 * * *"   # 5:17am, 11:17am, 5:17pm Pacific (winter); off the top of the hour on purpose
  workflow_dispatch: {}      # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
