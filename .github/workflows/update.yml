name: Update movie page

on:
  schedule:
    - cron: "17 13,19,1 * * *"   # ~5am, 11am, 5pm Pacific (winter)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions: {}      # nothing by default; each job asks only for what it needs

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read     # build only reads the repository
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build page
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 build.py

      - name: Keep today's title list for the history job
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: titles-today
          path: titles-today.json
          if-no-files-found: ignore
          retention-days: 2

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

      # GitHub sometimes lists the just-uploaded artifact late ("Found 0 artifact(s)")
      # or is busy with another deployment. One failed attempt must not break the run:
      # wait a minute and try once more. Only if the retry fails too is the run red.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      # Runs last, even if something above failed. The page is already published;
      # if build.py found problems (or a step failed) the run is marked red,
      # which triggers GitHub's "failed workflow" notification, and Healthchecks
      # (optional, secret HC_PING_URL) gets a success or failure ping.
      - name: Report problems
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          msg=""
          [ -s problems.txt ] && msg="$(cat problems.txt)"
          if [ "$JOB_STATUS" != "success" ]; then
            msg="A workflow step failed ($JOB_STATUS) - open the run log for details.
          $msg"
          fi
          if [ -n "$HC_PING_URL" ]; then
            if [ -n "$msg" ]; then
              curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$msg" "$HC_PING_URL/fail" || true
            else
              curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL" || true
            fi
          fi
          if [ -n "$msg" ]; then
            printf '%s\n' "$msg" | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
            exit 1
          fi
          echo "All good."

  # GitHub pauses scheduled workflows after 60 days without commits.
  # If the last commit is older than 45 days, add an empty one. This is the only job with write access.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Keep the schedule alive
        continue-on-error: true      # never let this block anything
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

  # Keeps a running list of every title the theaters used (raw names, TMDB match, anomalies) on the 'data' branch,
  # so months of real data pile up for spotting new naming patterns. Never blocks or fails anything.
  # Write access is limited to this job (like keepalive); the build job above still only reads.
  log-titles:
    if: always() && github.event_name != 'push'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Merge today's titles into the history
        continue-on-error: true      # never let this block anything
        run: |
          set -e
          if ! git fetch --depth=1 origin data; then echo "no data branch yet"; fi
          if git rev-parse --verify -q origin/data >/dev/null; then
            git worktree add datawt -B data origin/data
          else
            git worktree add --orphan -b data datawt
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        continue-on-error: true
        with:
          name: titles-today
      - name: Commit the history
        continue-on-error: true
        run: |
          set -e
          [ -f titles-today.json ] || { echo "no titles file today"; exit 0; }
          python3 merge_titles.py titles-today.json datawt/titles.json
          cd datawt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add titles.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "titles history $(date -u +%F)"
          git push origin data
