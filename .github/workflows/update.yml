name: Update movie page

on:
  schedule:
    - cron: "17 13,19,1 * * *"   # ~5am, 11am, 5pm Pacific (winter)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write    # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # GitHub pauses scheduled workflows after 60 days without commits.
      # If the last commit is older than 45 days, add an empty one.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true      # never let this block the page build
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

      - name: Build page
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      # Runs last, even if something above failed. The page is already published;
      # if build.py found problems (or a step failed) the run is marked red,
      # which triggers GitHub's "failed workflow" notification, and Healthchecks
      # (optional, secret HC_PING_URL) gets a success or failure ping.
      - name: Report problems
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          msg=""
          [ -s problems.txt ] && msg="$(cat problems.txt)"
          if [ "$JOB_STATUS" != "success" ]; then
            msg="A workflow step failed ($JOB_STATUS) - open the run log for details.
          $msg"
          fi
          if [ -n "$HC_PING_URL" ]; then
            if [ -n "$msg" ]; then
              curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$msg" "$HC_PING_URL/fail" || true
            else
              curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL" || true
            fi
          fi
          if [ -n "$msg" ]; then
            printf '%s\n' "$msg" | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done
            exit 1
          fi
          echo "All good."
